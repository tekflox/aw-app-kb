name: Build

# Push/PR-triggered quality gate: coverage ratchet + blocking pylint E-class,
# per docs/standards/pipeline-testing.md (pilot card). The shared
# tekflox/aw-marketplace release workflow (release.yml) does not have these
# steps yet — that is Phase 2 of the standard's rollout, a separate repo —
# so until then this repo's own gate lives here.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: {}

jobs:
  backend:
    runs-on: [self-hosted, aw-baremetal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install deps
        run: pip install -r kb_app/requirements-dev.txt
      # tests/validate_manifest.py falls back to a sibling aw-marketplace
      # checkout for the canonical schema when this repo has no local
      # schemas/ copy (by design — see that file's docstring). That sibling
      # already exists in this workspace's own dev container (every app
      # repo is checked out next to aw-marketplace there), which is why
      # this passed locally — but actions/checkout@v4 refuses a `path`
      # that escapes $GITHUB_WORKSPACE ("Repository path ... is not
      # under ..."), so a true sibling checkout isn't possible on a real
      # runner. Check it out into a subdirectory instead and point
      # --schema at it explicitly, bypassing the fallback altogether.
      - uses: actions/checkout@v4
        with:
          repository: tekflox/aw-marketplace
          path: .aw-marketplace-schema
      - name: Validate manifest
        run: python3 tests/validate_manifest.py aw-app.json --schema .aw-marketplace-schema/schemas/aw-app.schema.json
      - name: Test suite + coverage gate
        # fail_under is read from pyproject.toml's [tool.coverage.report] —
        # a one-way ratchet, see docs/standards/pipeline-testing.md §4.2.
        # html + xml reports are generated alongside the blocking
        # term-missing one specifically so the html report can be published
        # as a downloadable artifact below — this step still fails (and
        # skips the upload) if coverage drops below fail_under.
        run: |
          PYTHONPATH=. pytest --cov=kb_app --cov-report=term-missing \
            --cov-report=html --cov-report=xml tests/ -q
      - name: Upload coverage report artifact
        # Downloadable straight from the Actions run's Summary page — no
        # local pytest run needed to see what's covered. if: always() so a
        # failing coverage gate still publishes the report that explains why.
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: |
            htmlcov/
            coverage.xml
          retention-days: 30
      - name: Lint (pylint E-class, blocking)
        # --errors-only per docs/standards/pipeline-testing.md §5.2, minus
        # E0401 (lazy-import false positives) and E1101 (astroid can't
        # infer psycopg3's generically-typed Connection through this
        # repo's lazy-import + module-global-Optional pattern — verified
        # false positive on every flagged line, see the pilot card report).
        run: pylint kb_app --disable=all --enable=E --disable=E0401,E1101

  frontend:
    runs-on: [self-hosted, aw-baremetal]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - working-directory: ui
        run: npm install
      - working-directory: ui
        run: npm run build

  image:
    needs: [backend, frontend]
    runs-on: [self-hosted, aw-baremetal]
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build -t aw-app-kb:ci .
