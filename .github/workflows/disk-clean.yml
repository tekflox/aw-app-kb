name: Disk clean
on:
  workflow_dispatch:
    inputs:
      apply:
        description: "actually delete"
        type: boolean
        default: false
jobs:
  clean:
    runs-on: [self-hosted, aw-baremetal]
    steps:
      - uses: actions/checkout@v4
      - name: Clean
        env:
          APPLY: ${{ inputs.apply }}
        run: |
          set +e
          echo "=== BEFORE ==="; df -h / | tail -1
          docker system df | sed -n '1p;5p'

          echo "### docker build cache"
          if [ "$APPLY" = "true" ]; then docker builder prune -a -f 2>&1 | tail -2; fi

          echo "### gh-runners (idle only, never this job's own runner)"
          SELF=$(echo "$GITHUB_WORKSPACE" | cut -d/ -f5)
          echo "self=$SELF"
          for d in /home/ubuntu/gh-runners/*/; do
            n=$(basename "$d")
            if [ "$n" = "$SELF" ]; then echo "  skip $n (this job)"; continue; fi
            if ps -eo args | grep "[R]unner.Worker" | grep -q "$n"; then echo "  skip $n (busy)"; continue; fi
            sz=$(du -sh "$d/_work" 2>/dev/null | cut -f1)
            if [ "$APPLY" = "true" ]; then
              rm -rf "$d"/_work/* 2>/dev/null
              find "$d/_diag" -type f -name '*.log' -delete 2>/dev/null
            fi
            echo "  cleaned $n (_work was $sz)"
          done

          echo "### root-level via container"
          if [ "$APPLY" = "true" ]; then
            docker run --rm --privileged -v /:/host -v "$PWD/.github/scripts:/s:ro" alpine sh /s/disk-clean-root.sh
          fi

          echo "=== AFTER ==="; df -h / | tail -1
          docker system df | sed -n '1p;5p'
