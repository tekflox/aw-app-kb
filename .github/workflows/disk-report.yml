name: Disk report
on:
  workflow_dispatch: {}
jobs:
  report:
    runs-on: [self-hosted, aw-baremetal]
    steps:
      - name: Where the space is
        run: |
          set +e
          echo "=== /opt (111G) ==="; du -xh --max-depth=2 /opt 2>&1 | grep -vi "permission denied" | sort -rh | head -20
          echo "=== biggest files >1G ==="; find /opt /home /var -xdev -type f -size +1G 2>/dev/null | head -25
          echo "=== sizes of those ==="; find /opt /home /var -xdev -type f -size +1G -exec ls -lh {} \; 2>/dev/null | awk '{print $5"\t"$9}' | sort -rh | head -25
          echo "=== /var/log ==="; du -xh --max-depth=2 /var/log 2>&1 | grep -vi "permission denied" | sort -rh | head -10
          echo "=== docker reclaimable detail ==="; docker system df -v 2>&1 | head -5
          echo "=== dangling images ==="; docker images -f dangling=true --format "{{.Size}}\t{{.ID}}" 2>&1 | sort -rh | head -10
          echo "=== exited containers ==="; docker ps -a --filter status=exited --format "{{.Names}}\t{{.Status}}" 2>&1 | wc -l
