name: Disk report

# TEMPORARY, read-only. Delete once the space is accounted for.
on:
  workflow_dispatch: {}

jobs:
  report:
    runs-on: [self-hosted, aw-baremetal]
    steps:
      - name: Disk usage
        run: |
          set +e
          echo "=== can we sudo? ==="; sudo -n true && echo yes || echo "no (passwordless sudo unavailable)"
          echo "=== / top level ==="; du -xh --max-depth=1 / 2>&1 | grep -vi "permission denied" | sort -rh | head -16
          echo "=== /var ==="; du -xh --max-depth=2 /var 2>&1 | grep -vi "permission denied" | sort -rh | head -14
          echo "=== /home ==="; du -xh --max-depth=3 /home 2>&1 | grep -vi "permission denied" | sort -rh | head -16
          echo "=== docker ==="; docker system df 2>&1 | head -8
          echo "=== podman ==="; podman system df 2>&1 | head -8
          echo "=== biggest files anywhere readable ==="
          find / -xdev -type f -size +2G 2>/dev/null | head -20
