name: Publish image

# Builds the single aw-app-kb image (Postgres+pgvector base + FastAPI
# backend + built UI, see Dockerfile) and pushes it to
# ghcr.io/<owner>/aw-app-kb. Two ways in:
#
#   - workflow_dispatch: manual run, amd64 + linux/arm64 by default.
#   - workflow_call: release.yml's `publish` job calls this automatically,
#     BEFORE the version bump + marketplace sync, whenever a push to `main`
#     touches a path that actually lands in the image — kb_app/, skills/,
#     ui/, entrypoint.sh, Dockerfile, read straight off this Dockerfile's
#     own COPY lines (see release.yml's `changed-paths` job, keep the two
#     lists in sync). A docs/metadata-only push never reaches this job, so
#     it never pays for a build. Forced to amd64-only on that automatic
#     path — QEMU arm64 emulation measured ~8x slower on this same
#     runner/image family (aw-mcp-gateway run 36450565287: 11m with arm64
#     vs. its own ~80s amd64-only baseline) — manual runs keep the
#     amd64+arm64 default below.
#
#   gh workflow run publish.yml                          # amd64 + linux/arm64 (default)
#   gh workflow run publish.yml -f include_arm64=false   # amd64 only (skip QEMU arm64)
on:
  workflow_dispatch:
    inputs:
      include_arm64:
        description: 'Also build linux/arm64 (QEMU emulation; slower)'
        type: boolean
        default: true
  workflow_call:
    inputs:
      include_arm64:
        description: 'Also build linux/arm64 (QEMU emulation; slower)'
        type: boolean
        default: false

concurrency:
  group: publish-aw-app-kb-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  publish:
    name: aw-app-kb
    runs-on: [self-hosted, aw-baremetal]
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      # ghcr.io rejects mixed-case namespaces — lowercase the owner login.
      - name: Lowercase repo owner
        id: owner
        run: echo "lc=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Resolve platforms
        id: plat
        run: |
          if [ "${{ inputs.include_arm64 }}" = "true" ]; then
            echo "platforms=linux/amd64,linux/arm64" >> "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ steps.plat.outputs.platforms }}
          push: true
          tags: |
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-kb:latest
            ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-kb:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.description=Knowledge Base app for Agentic Workspace (Postgres+pgvector, semantic search, MCP)
            org.opencontainers.image.licenses=MIT
          cache-from: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-kb:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-kb:buildcache,mode=max

      - name: Summary
        run: |
          {
            echo "## 🐳 aw-app-kb pushed"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| **Image** | \`ghcr.io/${{ steps.owner.outputs.lc }}/aw-app-kb:latest\` |"
            echo "| **Platforms** | ${{ steps.plat.outputs.platforms }} |"
          } >> "$GITHUB_STEP_SUMMARY"
